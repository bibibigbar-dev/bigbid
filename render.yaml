services:
  - type: web
    name: bigbid
    runtime: static
    repo: https://github.com/bibibigbar-dev/bigbid
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_OPENAI_API_KEY
        sync: false
